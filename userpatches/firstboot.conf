# Пресет первого входа Armbian (armbian-firstlogin).
# При сборке копируется в образ как /root/.not_logged_in_yet.
# В GitHub Actions этот файл перезаписывается из входов workflow.
#
# Пароли здесь НЕ задаются: root-пароль и пользователь создаются
# интерактивно при первом входе (root / 1234).

# Не спрашивать «Set user language based on your location?»
SET_LANG_BASED_ON_LOCATION="n"
PRESET_TIMEZONE="Europe/Moscow"
PRESET_LOCALE="en_US.UTF-8"
