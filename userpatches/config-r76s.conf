# Armbian для FriendlyElec NanoPi R76S (RK3576), vendor-ядро rk-6.1-rkr7.2 (6.1.17x).
# Локальная сборка: скопировать каталог userpatches/ в корень armbian/build и выполнить
#   ./compile.sh r76s
# Любой параметр можно переопределить в командной строке, например:
#   ./compile.sh r76s RELEASE=bookworm
# Параметры командной строки применяются после этого файла и имеют приоритет.

BOARD="nanopi-r76s"
BRANCH="vendor"
RELEASE="trixie"

# Минимальный CLI-образ
BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"

# .img.xz + .sha
COMPRESS_OUTPUTIMAGE="sha,img,xz"

# Не отправлять лог на paste-сервис Armbian
SHARE_LOG="no"

# Неглубокий клон ядра: экономит место и время
KERNEL_GIT="shallow"
